<nav
  class="fixed top-0 w-full z-50 transition-all duration-300"
  [class.bg-transparent]="!isScrolled"
  [class.bg-white]="isScrolled"
  [class.bg-opacity-90]="isScrolled"
  [class.backdrop-blur-md]="isScrolled"
  [class.shadow-md]="isScrolled"
  [class.dark:bg-gray-900]="isScrolled"
  [class.dark:bg-opacity-90]="isScrolled"
>
  <div
    class="max-w-screen-xl mx-auto px-4 h-20 flex items-center justify-between"
  >
    <a
      routerLink="/home"
      class="flex items-center gap-3 shrink-0 z-50"
      (click)="closeMenu()"
    >
      <img src="/logo.png" class="h-8" alt="Logo" />
      <span
        class="text-xl font-semibold transition-colors duration-300"
        [class.text-white]="!isScrolled"
        [class.text-gray-900]="isScrolled"
        [class.dark:text-white]="isScrolled"
      >
        Chasse aux sorcières
      </span>
    </a>

    <ul class="hidden md:flex flex-1 justify-center gap-8 font-medium text-sm">
      <ng-container
        *ngTemplateOutlet="navLinks; context: { mobile: false }"
      ></ng-container>
    </ul>

    <div class="hidden md:flex items-center gap-4 shrink-0">
      <ng-container
        *ngTemplateOutlet="authButtons; context: { mobile: false }"
      ></ng-container>
    </div>

    <div class="md:hidden flex items-center z-50">
      <button
        (click)="toggleMenu()"
        type="button"
        class="inline-flex items-center justify-center p-2 rounded-lg transition-colors focus:outline-none"
        [class.text-white]="!isScrolled && !isMenuOpen"
        [class.text-gray-600]="isScrolled || isMenuOpen"
        [class.dark:text-white]="isScrolled || isMenuOpen"
      >
        <span class="sr-only">Open menu</span>
        @if (!isMenuOpen) {
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        } @else {
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        }
      </button>
    </div>
  </div>

  @if (isMenuOpen) {
    <div
      class="md:hidden absolute top-0 left-0 w-full min-h-screen bg-gray-900 text-white flex flex-col items-center pt-24 gap-8 px-6 transition-all duration-300"
    >
      <ul class="flex flex-col items-center gap-6 text-lg font-medium w-full">
        <ng-container
          *ngTemplateOutlet="navLinks; context: { mobile: true }"
        ></ng-container>
      </ul>

      <div class="w-full h-px bg-gray-700"></div>

      <div class="flex flex-col w-full gap-4">
        <ng-container
          *ngTemplateOutlet="authButtons; context: { mobile: true }"
        ></ng-container>
      </div>
    </div>
  }
</nav>

<ng-template #navLinks let-mobile="mobile">
  <li>
    <a
      routerLink="/home"
      (click)="closeMenu()"
      class="transition-colors hover:text-blue-400"
      [class.text-white]="!isScrolled && !mobile"
      [class.text-gray-900]="isScrolled && !mobile"
      [class.dark:text-white]="isScrolled && !mobile"
    >
      Accueil
    </a>
  </li>
  <li>
    <a
      routerLink="/equipe"
      (click)="closeMenu()"
      class="transition-colors hover:text-blue-400"
      [class.text-white]="!isScrolled && !mobile"
      [class.text-gray-900]="isScrolled && !mobile"
      [class.dark:text-white]="isScrolled && !mobile"
    >
      L'équipe
    </a>
  </li>
  <li>
    <a
      routerLink="/roles"
      (click)="closeMenu()"
      class="transition-colors hover:text-blue-400"
      [class.text-white]="!isScrolled && !mobile"
      [class.text-gray-900]="isScrolled && !mobile"
      [class.dark:text-white]="isScrolled && !mobile"
    >
      Rôles
    </a>
  </li>
  <li>
    <a
      routerLink="/regles"
      (click)="closeMenu()"
      class="transition-colors hover:text-blue-400"
      [class.text-white]="!isScrolled && !mobile"
      [class.text-gray-900]="isScrolled && !mobile"
      [class.dark:text-white]="isScrolled && !mobile"
    >
      Règles
    </a>
  </li>
  @if ((authService.role$ | async)?.includes("ROLE_MJ")) {
    <li>
      <a
        routerLink="/gestion"
        (click)="closeMenu()"
        class="transition-colors hover:text-blue-400"
        [class.text-white]="!isScrolled && !mobile"
        [class.text-gray-900]="isScrolled && !mobile"
        [class.dark:text-white]="isScrolled && !mobile"
      >
        Gestion
      </a>
    </li>
  }
</ng-template>

<ng-template #authButtons let-mobile="mobile">
  @if (authService.isLoggedIn$ | async) {
    <button
      (click)="logout()"
      class="rounded-lg text-sm px-6 py-2.5 transition-all font-medium border text-white"
      [class.w-full]="mobile"
      [class.bg-transparent]="!isScrolled && !mobile"
      [class.border-white]="!isScrolled && !mobile"
      [class.hover:bg-white]="!isScrolled && !mobile"
    >
      Déconnexion
    </button>
  } @else {
    <button
      (click)="loginWithDiscord(); closeMenu()"
      class="rounded-lg text-sm px-6 py-2.5 transition-all font-medium"
      [class.w-full]="mobile"
      [class.bg-white]="!isScrolled && !mobile"
      [class.text-blue-700]="!isScrolled && !mobile"
      [class.hover:bg-gray-100]="!isScrolled && !mobile"
      [class.bg-blue-700]="isScrolled || mobile"
      [class.text-white]="isScrolled || mobile"
      [class.hover:bg-blue-800]="isScrolled || mobile"
    >
      Connexion
    </button>
  }
</ng-template>
