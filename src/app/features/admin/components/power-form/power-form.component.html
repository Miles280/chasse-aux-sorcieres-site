<div class="mb-8 pb-8 border-b border-white/10">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-lg font-semibold text-violet-300">Pouvoirs</h3>
    <button
      type="button"
      (click)="addPower()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-900/30 border border-violet-500/30 text-violet-300 hover:bg-violet-900/50 hover:border-violet-500 hover:text-white transition-all duration-300 text-sm font-medium"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4"
        />
      </svg>
      Ajouter un pouvoir
    </button>
  </div>

  <!-- Powers List (Drag & Drop) -->
  <div cdkDropList (cdkDropListDropped)="dropPower($event)" class="space-y-4">
    @for (
      powerControl of powersFormArray.controls;
      track powerControl;
      let i = $index
    ) {
      <div
        cdkDrag
        [cdkDragRootElement]="'.power-card'"
        [formGroup]="asFormGroup(powerControl)"
        class="power-card group relative bg-[#0a0a0c]/80 rounded-lg border border-violet-500/20 p-4 hover:border-violet-500/40 transition-all"
      >
        <!-- Drag Handle -->
        <div
          cdkDragHandle
          class="drag-handle absolute left-2 top-4 cursor-grab active:cursor-grabbing text-gray-600 hover:text-violet-400 transition-colors"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 8h16M4 16h16"
            />
          </svg>
        </div>

        <!-- Delete Button -->
        <button
          type="button"
          (click)="removePower(i)"
          class="absolute right-2 top-4 text-red-400 hover:text-red-300 transition-colors"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <div class="pl-8 pr-8">
          <!-- Position Badge -->
          <div class="mb-3">
            <span
              class="inline-block px-2 py-1 text-xs font-medium bg-violet-900/40 text-violet-300 rounded"
            >
              Position {{ i + 1 }}
            </span>
          </div>

          <!-- Title -->
          <div class="mb-3">
            <label class="block text-xs font-medium text-gray-400 mb-1">
              Titre du pouvoir <span class="text-red-400">*</span>
            </label>
            <input
              type="text"
              formControlName="title"
              placeholder="Ex: Vision nocturne"
              class="w-full px-3 py-2 text-sm rounded-lg bg-[#0a0a0c] border border-violet-500/30 text-white placeholder-gray-600 focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500/20 transition-all"
            />
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="block text-xs font-medium text-gray-400 mb-1">
              Description <span class="text-red-400">*</span>
            </label>
            <textarea
              formControlName="description"
              rows="4"
              placeholder="Comment fonctionne ce pouvoir..."
              class="w-full px-3 py-2 text-sm rounded-lg bg-[#0a0a0c] border border-violet-500/30 text-white placeholder-gray-600 focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500/20 transition-all resize-vertical"
            ></textarea>
          </div>

          <!-- Options -->
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
            <label
              class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"
            >
              <input
                type="checkbox"
                formControlName="isDayPower"
                class="rounded border-violet-500/30 bg-[#0a0a0c] text-violet-500 focus:ring-violet-500/20"
              />
              Pouvoir de jour
            </label>

            <label
              class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"
            >
              <input
                type="checkbox"
                formControlName="isPassive"
                class="rounded border-violet-500/30 bg-[#0a0a0c] text-violet-500 focus:ring-violet-500/20"
              />
              Pouvoir passif
            </label>

            <label
              class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer"
            >
              <input
                type="checkbox"
                formControlName="leavingHouse"
                class="rounded border-violet-500/30 bg-[#0a0a0c] text-violet-500 focus:ring-violet-500/20"
              />
              Sort de la maison
            </label>
          </div>

          <!-- Usage Limit -->
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">
              Limite d'utilisation (vide = illimité)
            </label>
            <input
              type="number"
              formControlName="usageLimit"
              min="0"
              placeholder="Illimité"
              class="w-full md:w-32 px-3 py-2 text-sm rounded-lg bg-[#0a0a0c] border border-violet-500/30 text-white placeholder-gray-600 focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500/20 transition-all"
            />
          </div>
        </div>
      </div>
    } @empty {
      <div
        class="text-center py-12 bg-[#0a0a0c]/50 rounded-lg border border-violet-500/20"
      >
        <svg
          class="w-12 h-12 text-gray-600 mx-auto mb-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
        <p class="text-gray-500 text-sm">
          Aucun pouvoir ajouté. Cliquez sur "Ajouter un pouvoir".
        </p>
      </div>
    }
  </div>
</div>
