<div
  class="min-h-screen bg-gradient-to-b from-[#0a0a0c] via-[#1a0b2e] to-[#0a0a0c] py-20"
>
  <div class="max-w-screen-xl mx-auto px-6">
    <!-- Header -->
    <div class="mb-12">
      <button
        (click)="goBack()"
        class="group inline-flex items-center gap-2 text-violet-300 hover:text-white transition-colors mb-6"
      >
        <svg
          class="w-5 h-5 transition-transform group-hover:-translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        Retour
      </button>

      <div class="text-center">
        <h1
          class="font-test font-extrabold text-4xl md:text-5xl mb-4 animate-text-glow bg-gradient-to-r from-violet-600 via-fuchsia-400 to-violet-600"
        >
          Gestion des rôles
        </h1>
        <p class="text-violet-100/70 text-lg max-w-2xl mx-auto">
          Créez, modifiez et supprimez les rôles du jeu
        </p>
        <div
          class="h-px w-24 mx-auto bg-gradient-to-r from-transparent via-violet-500/60 to-transparent mt-6"
        ></div>
      </div>
    </div>

    <!-- View Toggle -->
    <div class="flex justify-center gap-4 mb-12">
      <button
        (click)="showList()"
        class="px-8 py-3 rounded-xl font-medium transition-all duration-300"
        [ngClass]="
          viewMode === 'list'
            ? 'bg-gradient-to-r from-violet-600 via-fuchsia-500 to-violet-600 text-white shadow-[0_0_20px_rgba(109,40,217,0.4)]'
            : 'bg-violet-900/20 border border-violet-500/30 text-violet-300 hover:border-violet-500/50 hover:text-white'
        "
      >
        Liste des rôles
      </button>
      <button
        (click)="handleCreate()"
        class="px-8 py-3 rounded-xl font-medium transition-all duration-300"
        [ngClass]="
          viewMode === 'form'
            ? 'bg-gradient-to-r from-violet-600 via-fuchsia-500 to-violet-600 text-white shadow-[0_0_20px_rgba(109,40,217,0.4)]'
            : 'bg-violet-900/20 border border-violet-500/30 text-violet-300 hover:border-violet-500/50 hover:text-white'
        "
      >
        Créer un rôle
      </button>
    </div>

    <!-- LIST VIEW -->
    @if (viewMode === "list") {
      <app-role-list
        [roles]="roles"
        [isLoading]="isLoading"
        (edit)="handleEdit($event)"
        (delete)="handleDelete($event)"
        (create)="handleCreate()"
      />
    }

    <!-- FORM VIEW -->
    @if (viewMode === "form") {
      <app-role-form
        [role]="selectedRole"
        (save)="handleSave($event)"
        (cancel)="showList()"
      />
    }
  </div>
</div>
