<div
  class="min-h-screen bg-gradient-to-b from-[#0a0a0c] via-[#1a0b2e] to-[#0a0a0c] py-20"
>
  <div class="max-w-screen-xl mx-auto px-6">
    <!-- Header -->
    <div class="text-center mb-16 relative">
      <div class="absolute top-0 right-0">
        <button
          (click)="logout()"
          class="group relative inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-violet-600/20 via-fuchsia-500/20 to-violet-600/20 border border-violet-500/30 text-violet-200 hover:text-white hover:border-violet-500 transition-all duration-300 hover:shadow-[0_0_20px_rgba(109,40,217,0.3)]"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          Se déconnecter
        </button>
      </div>

      <h1
        class="font-test font-extrabold text-4xl md:text-5xl mb-4 animate-text-glow bg-gradient-to-r from-violet-600 via-fuchsia-400 to-violet-600"
      >
        Gestion
      </h1>
      <p class="text-violet-100/70 text-lg max-w-2xl mx-auto">
        Choisissez les paramètres à modifier
      </p>
      <div
        class="h-px w-24 mx-auto bg-gradient-to-r from-transparent via-violet-500/60 to-transparent mt-6"
      ></div>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Card Template -->
      <div
        *ngFor="let card of adminCards"
        (click)="navigateTo(card.route)"
        class="group relative overflow-hidden p-8 rounded-2xl bg-[#1c1a26] border border-white/10 hover:border-violet-500/50 transition-all duration-500 hover:-translate-y-2 shadow-[0_10px_30px_rgba(0,0,0,0.5)] hover:shadow-[0_20px_50px_rgba(109,40,217,0.3)] cursor-pointer"
      >
        <!-- Glow Effect -->
        <div
          class="absolute -top-20 -left-20 w-64 h-64 blur-[100px] rounded-full pointer-events-none transition-colors duration-500"
          [ngClass]="{
            'bg-violet-800/10 group-hover:bg-violet-600/20':
              card.color === 'primary',
            'bg-purple-800/10 group-hover:bg-purple-600/20':
              card.color === 'info',
            'bg-fuchsia-800/10 group-hover:bg-fuchsia-600/20':
              card.color === 'success',
          }"
        ></div>

        <div class="relative z-10">
          <!-- Icon -->
          <div
            class="w-14 h-14 rounded-lg flex items-center justify-center mb-6 text-3xl group-hover:scale-110 transition-transform duration-300"
            [ngClass]="{
              'bg-violet-900/40': card.color === 'primary',
              'bg-purple-900/40': card.color === 'info',
              'bg-fuchsia-900/40': card.color === 'success',
            }"
          >
            {{ card.icon }}
          </div>

          <!-- Content -->
          <h2
            class="text-xl font-bold text-white mb-3 group-hover:text-violet-300 transition-colors"
          >
            {{ card.title }}
          </h2>
          <p
            class="text-gray-400 leading-relaxed text-sm group-hover:text-gray-300 transition-colors"
          >
            {{ card.description }}
          </p>
        </div>

        <!-- Arrow indicator -->
        <div
          class="absolute bottom-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        >
          <svg
            class="w-5 h-5 text-violet-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            />
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
