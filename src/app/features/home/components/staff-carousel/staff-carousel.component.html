<section class="bg-gray-900 overflow-hidden">
  <div class="max-w-screen-xl mx-auto py-16 px-6">
    <h4
      class="text-xl font-bold text-white max-w-2xl mb-16 uppercase tracking-widest"
    >
      Rejoins une communauté de joueurs passionnés !
    </h4>

    <div class="relative overflow-hidden">
      <div
        class="absolute inset-y-0 left-0 w-32 bg-gradient-to-r from-gray-900 to-transparent z-10 pointer-events-none"
      ></div>
      <div
        class="absolute inset-y-0 right-0 w-32 bg-gradient-to-l from-gray-900 to-transparent z-10 pointer-events-none"
      ></div>

      <div class="marquee-track flex py-6">
        <div class="flex gap-12 pr-12">
          @for (member of membres; track $index) {
            <div class="group text-center w-40 flex-shrink-0 cursor-default">
              <div
                class="mx-auto mb-4 w-[100px] h-[100px] rounded-full flex items-center justify-center border-4 border-gray-800 shadow-lg shadow-black/50 transition-transform duration-300 ease-out group-hover:scale-112 {{
                  member.bg
                }}"
              >
                <span class="text-white text-2xl font-bold">{{
                  member.nom[0]
                }}</span>
              </div>
              <h3 class="text-lg font-bold text-white">{{ member.nom }}</h3>
              <p class="text-blue-400 text-sm font-medium">{{ member.role }}</p>
            </div>
          }
        </div>

        <div class="flex gap-12 pr-12">
          @for (member of membres; track $index) {
            <div class="group text-center w-40 flex-shrink-0 cursor-default">
              <div
                class="mx-auto mb-4 w-[100px] h-[100px] rounded-full flex items-center justify-center border-4 border-gray-800 shadow-lg shadow-black/50 transition-transform duration-300 ease-out group-hover:scale-112 {{
                  member.bg
                }}"
              >
                <span class="text-white text-2xl font-bold">{{
                  member.nom[0]
                }}</span>
              </div>
              <h3 class="text-lg font-bold text-white">{{ member.nom }}</h3>
              <p class="text-blue-400 text-sm font-medium">{{ member.role }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
