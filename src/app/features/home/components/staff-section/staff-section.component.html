<section class="border-t border-gray-800 overflow-hidden py-16 relative">
  <div
    class="absolute inset-0 opacity-10"
    style="
      background-image: radial-gradient(#4b5563 1px, transparent 1px);
      background-size: 20px 20px;
    "
  ></div>

  <div class="max-w-screen-xl mx-auto px-6 relative z-10 text-center mb-12">
    <h4
      class="text-sm md:text-base font-bold text-blue-400 uppercase tracking-[0.3em] mb-2"
    >
      Communauté
    </h4>
    <h2 class="text-2xl md:text-3xl font-bold text-white font-test">
      Les Habitants de Nistrium
    </h2>
  </div>

  <div class="relative overflow-hidden w-full">
    <div
      class="absolute inset-y-0 left-0 w-24 md:w-64 bg-gradient-to-r from-gray-900 to-transparent z-10 pointer-events-none"
    ></div>
    <div
      class="absolute inset-y-0 right-0 w-24 md:w-64 bg-gradient-to-l from-gray-900 to-transparent z-10 pointer-events-none"
    ></div>

    <div class="marquee-track flex py-4">
      <div class="flex gap-8 md:gap-16 pr-8 md:pr-16 animate-marquee">
        @for (member of membres; track $index) {
          <div
            class="group flex flex-col items-center w-32 md:w-40 flex-shrink-0 cursor-default opacity-70 hover:opacity-100 transition-opacity"
          >
            <div class="relative mb-4">
              <div
                class="w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center border-2 border-gray-700 shadow-lg bg-gray-800 group-hover:scale-105 group-hover:border-blue-500 transition-all duration-300 {{
                  member.bg
                }}"
              >
                <span class="text-white text-2xl font-bold">{{
                  member.nom[0]
                }}</span>
              </div>
              <div
                class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-gray-900 rounded-full"
              ></div>
            </div>
            <h3
              class="text-base font-bold text-white truncate w-full text-center"
            >
              {{ member.nom }}
            </h3>
            <p
              class="text-xs text-blue-400 uppercase tracking-wider font-semibold"
            >
              {{ member.role }}
            </p>
          </div>
        }
      </div>

      <div
        class="flex gap-8 md:gap-16 pr-8 md:pr-16 animate-marquee"
        aria-hidden="true"
      >
        @for (member of membres; track $index) {
          <div
            class="group flex flex-col items-center w-32 md:w-40 flex-shrink-0 cursor-default opacity-70 hover:opacity-100 transition-opacity"
          >
            <div class="relative mb-4">
              <div
                class="w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center border-2 border-gray-700 shadow-lg bg-gray-800 group-hover:scale-105 group-hover:border-blue-500 transition-all duration-300 {{
                  member.bg
                }}"
              >
                <span class="text-white text-2xl font-bold">{{
                  member.nom[0]
                }}</span>
              </div>
              <div
                class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-gray-900 rounded-full"
              ></div>
            </div>
            <h3
              class="text-base font-bold text-white truncate w-full text-center"
            >
              {{ member.nom }}
            </h3>
            <p
              class="text-xs text-blue-400 uppercase tracking-wider font-semibold"
            >
              {{ member.role }}
            </p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
